{% extends 'base.html' %}

{% block title %}
    {{ block.super }}
{% endblock title %}

{% load static %}

{% block body %}
<!-- Possivelmente necessário colocar mais uma div externa para agregar todas as divs -->

<div class="subcontainer-tela">
    <video class="video-fundo" autoplay muted loop playsinline>
        <source src="{% static 'img/tela_fundo.mp4' %}" type="video/mp4">
    </video>

    <div class="tela_transparente">
        <img class="img-logo" src="{% static 'img/ticket.png' %}" alt="Imagem logo">
        <b class="titulo">{{ user.username }}</b>
        <p class="texto">VOCÊ FAZ TUDO FUNCIONAR</p>
    </div>

</div>



{% endblock body %}

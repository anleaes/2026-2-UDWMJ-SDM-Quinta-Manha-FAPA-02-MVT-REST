
{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    {% block metadados_adicionais %}
        <!-- Caso seja necessário adicionar outros arquivos css nos templates filhos -->
    {% endblock metadados_adicionais %}

    <title>{% block title %}Ingresso App{% endblock title %}</title>
</head>
<body>
    {% if user.is_authenticated %}
        <a href="{% url 'conta_usuario:desconectar_usuario' %}"><button>Sair</button></a>
        {% for permissao in user.get_group_permissions %}
            <p> {{ permissao }} </p>
        {% endfor %}
    {% endif %}

    {% block body %}
    
    {% endblock body %}
    
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>

{% extends 'base.html' %}

{% load static %}

{% block title %}
  Registrar Beneficio - {{ block.super }}
{% endblock %}


{% block body %}
<!-- ------------------------- -->
<h1> Registrar Benefício </h1>

<div>
  <form action="" method="POST">
    {% csrf_token %}

    <div>
      <label>Nome:</label>
      {{ form.nome }}
    </div>

     <div>
      <label>Descrição:</label>
      {{ form.descricao }}
    </div>

    <button type="submit" id="criar-beneficio">Salvar</button>
  </form>
</div>

<!-- ------------------------- -->
{% endblock body %}

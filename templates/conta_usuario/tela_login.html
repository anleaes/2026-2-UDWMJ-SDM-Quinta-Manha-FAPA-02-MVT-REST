
{% load static %}

<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>IngressoApp - Login</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<h1> Login </h1>

<div>
    <form action="" method="POST">
    {% csrf_token %}

    <div>
        <label>Usuário</label>
        <input type="text" id="username" name="usuario" placeholder="Nome de Usuário" required>
    </div>
    <div>
        <label>Senha</label>
        <input type="password" id="password" name="senha" placeholder="Senha Aqui" required>
    </div>

    <button type="submit">Login</button>
  </form>
</div>

  <script src="{% static 'js/script.js' %}"></script>
</body>
</html>

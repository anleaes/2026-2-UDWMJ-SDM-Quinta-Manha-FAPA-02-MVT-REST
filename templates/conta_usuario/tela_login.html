
{% load static %}

<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>IngressoApp - Login</title>
    <link rel="stylesheet" href="{% static 'css/conta_usuario/tela_login.css' %}">
</head>
<body>

<h1 id="titulo-principal"> <img src="{% static 'img/icone_estrela.png' %}"> IngressoApp <img src="{% static 'img/icone_estrela.png' %}"></h1>

<div id="login-form">
    <img src="{% static 'img/ticket.png' %}"/>
    <form action="" method="POST">
    {% csrf_token %}

    <div>
        <label>Usuário:</label>
        <input type="text" id="username" name="usuario" placeholder="Nome de Usuário" required>
    </div>
    <div>
        <label>Senha:</label>
        <input type="password" id="password" name="senha" placeholder="Senha Aqui" required>
    </div>

    <button type="submit"> <p>Login</p> </button>
  </form>
</div>

  <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
